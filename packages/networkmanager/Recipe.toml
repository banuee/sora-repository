[package]
name = "networkmanager"
version = "1.58.1"
description = "Network connection manager and user applications (nmcli, nmtui)"
homepage = "https://networkmanager.dev"
type = "binary"

[source]
url = "https://geo.mirror.pkgbuild.com/extra/os/x86_64/networkmanager-1.58.1-3-x86_64.pkg.tar.zst"

[sandbox]
share_network = true
share_ipc = true
bind_home = true
bind_config = "NetworkManager"
binds = [
    "/run/NetworkManager",
    "/run/dbus/system_bus_socket",
    "/etc/NetworkManager"
]

[install]
binaries = [
    { source = "usr/bin/nmcli", target = "nmcli" },
    { source = "usr/bin/nmtui", target = "nmtui" },
    { source = "usr/bin/NetworkManager", target = "NetworkManager" }
]
desktop_entry = { name = "NetworkManager TUI", exec = "nmtui", icon = "network-workgroup", categories = "System;Settings;", comment = "Manage network connections via terminal interface" }
