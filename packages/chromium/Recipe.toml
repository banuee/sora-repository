[package]
name = "chromium"
version = "156.0.8078.79"
description = "Fast, secure, and privacy-focused web browser"
homepage = "https://www.chromium.org"
type = "binary"

[source]
url = "https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/156.0.8078.79-1/ungoogled-chromium-156.0.8078.79-1-x86_64_linux.tar.xz"

[sandbox]
share_network = true
share_ipc = true
bind_home = true
bind_config = "chromium"
binds = [
    "~/Downloads",
    "~/.pki"
]

[install]
binaries = [
    { source = "ungoogled-chromium-156.0.8078.79-1-x86_64_linux/chrome", target = "chromium" }
]
desktop_entry = { name = "Chromium", exec = "chromium %U", icon = "chromium", categories = "Network;WebBrowser;", comment = "Access the Internet" }
